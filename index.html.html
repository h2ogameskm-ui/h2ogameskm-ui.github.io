function Lvl(w){
  const g = Array.from({ length: ROWS }, () => Array(w).fill('.'));
  const hints = [];
  return { w, g, hints,
    gr(x0, x1, h, ch = 'G'){ for (let x = x0; x < x1; x++) for (let y = ROWS - h; y < ROWS; y++) g[y][x] = ch; },
    fill(x0, y0, x1, y1, ch){ for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = ch; },
    p(x, y, ch){ g[y][x] = ch; },
    co(x, y, n, dx = 1, dy = 0){ for (let i = 0; i < n; i++) g[y + i * dy][x + i * dx] = 'c'; },
    pl(x, y, n){ for (let i = 0; i < n; i++) g[y][x + i] = '-'; },
    hint(x, y, s){ hints.push({ x: x * T, y: y * T, s }); },
  };
}

// constructeur par segments (géométrie vérifiée : sauts ≤ 3 cases, montées ≤ 2 rangées)
function Seq(h0, opt = {}){
  const a = Lvl(420); let x = 0, h = h0;
  const s = () => ROWS - h, r = () => ROWS - 1 - h;
  const S = {
    start(){ a.gr(0, 7, h); a.p(2, r(), 'P'); if (opt.hint) a.hint(4, r(), opt.hint); x = 7; return S; },
    F(n, items = []){ a.gr(x, x + n, h); for (const [dx, ch, dy = 0] of items) a.p(x + dx, r() + dy, ch); x += n; return S; },
    K(){ return S.F(4, [[1, 'K']]); },
    GAP(n, bat){ a.co(x + (n >> 1), r() - 3, 1); if (bat) a.p(x + (n >> 1), r() - 5, 'V'); x += n; return S; },
    UP(n, dh){ x += n; h += dh; return S; },
    DROP(n, dh){ a.co(x + (n >> 1), r() - 1, 1); x += n; h -= dh; return S; },
    SP(n, star){ a.gr(x, x + n + 4, h); for (let i = 0; i < n; i++) a.p(x + 2 + i, r(), '^'); a.co(x + 2, r() - 3, n); if (star) a.p(x + 2 + (n >> 1), r() - 4, '*'); x += n + 4; return S; },
    PLAT(n, star){ a.p(x + ((n - 3) >> 1), s() - 1, 'm'); a.co(x + (n >> 1), s() - 3, 1); if (star) a.p(x + (n >> 1), s() - 5, '*'); x += n; return S; },
    CRUMB(n, star, saws){
      a.fill(x, s(), x + n - 1, s(), 'C'); for (let i = 1; i < n - 1; i += 3) a.co(x + i, s() - 2, 1);
      if (saws){ a.p(x + 2, s() - 3, 'U'); if (n > 7) a.p(x + n - 3, s() - 3, 'U'); }
      if (star) a.p(x + (n >> 1), s() - 4, '*');
      x += n; return S; },
    CHIMNEY(star){
      a.gr(x, x + 5, h); a.fill(x + 1, 0, x + 1, s() - 3, 'B'); a.co(x + 3, s() - 2, 1);
      if (star) a.p(x + 3, s() - 5, '*');
      x += 5; h += 7; return S; },
    CHAIN(k, star){
      for (let i = 0; i < k; i++) a.p(x + 3 + 4 * i, s() - 3, 'D');
      for (let i = 0; i < k - 1; i++) a.co(x + 5 + 4 * i, s() - 3, 1);
      if (star) a.p(x + 9, s() - 6, '*');
      x += 2 + 4 * k; return S; },
    STAIRS(star){
      a.gr(x, x + 16, h); a.pl(x + 2, r() - 2, 3); a.pl(x + 7, r() - 5, 3); a.pl(x + 12, r() - 8, 3);
      a.co(x + 3, r() - 3, 1); a.co(x + 8, r() - 6, 1); if (star) a.p(x + 13, r() - 10, '*'); else a.co(x + 13, r() - 9, 1);
      x += 16; return S; },
    SAWS(n, star){ a.gr(x, x + n, h); let k = 0; for (let i = 3; i < n - 2; i += 5, k++){ a.p(x + i, r(), 'O'); if (star && k === 0) a.p(x + i, r() - 3, '*'); else a.co(x + i, r() - 3, 1); } x += n; return S; },
    WIND(n, star){ const top = Math.max(1, s() - 7); for (let i = 0; i < n; i++) for (let y = top; y < ROWS; y++) a.p(x + i, y, 'W'); a.co(x + 1, Math.max(0, top - 2), n - 2); if (star) a.p(x + (n >> 1), Math.max(0, top - 4), '*'); x += n; return S; },
    USAW(n){ a.gr(x, x + n, h); for (let i = 3; i < n - 2; i += 6) a.p(x + i, r() - 2, 'U'); x += n; return S; },
    END(){
      a.gr(x, x + 10, h); a.p(x + 6, r(), 'F'); x += 10;
      if (opt.lava) for (let c = 0; c < x; c++) if (a.g[16][c] === '.' && a.g[15][c] === '.'){ a.g[15][c] = 'L'; a.g[16][c] = 'L'; }
      a.w = x; for (let y = 0; y < ROWS; y++) a.g[y].length = x;
      return a; },
  };
  return S;
}

      burst(lvl.flag.x + rnd(-60, 60), rnd(30, 120), cols, 28, 120, 0, 60); tone(rnd(200, 300), .3, 'triangle', .04, -150);
    }
  }
  updateEnemies(dt);
  updateParticles(dt);
  if (state === 'play' || state === 'dying') updateCam(dt);
  const dxc = cam.x - lastCamX; lastCamX = cam.x;
  updateAmb(dt, lvl.th.amb, dxc);
}

      if (!role){ bigTxt('PIP', VW / 2, y - 20, 24, '#fff3a0', '#ff9e4a'); txt('ET LES ETOILES PERDUES', VW / 2, y + 10, '#ffffff', 'center'); return; }
      txt(role, VW / 2, y, '#8a84a8', 'center');
      if (name === 'K') kaisTxt(VW / 2, y + 13, 16, '#ffffff', '#ffd23d');
      else bigTxt(name, VW / 2, y + 13, name.length > 14 ? 8 : 16, '#ffffff', '#9af0ff');
    });
  } else {
    const a = clamp((credT - creditsEndT()) * 1.5, 0, 1); b.globalAlpha = a;
    txt(endType === 'good' ? 'FIN 1 / 2 : LA VRAIE FIN' : 'FIN 2 / 2 : LA FIN TRISTE', VW / 2, VH / 2 - 68, endType === 'good' ? '#7aff9a' : '#ff9ab0', 'center');
    bigTxt("MERCI D'AVOIR JOUE !", VW / 2, VH / 2 - 44, 16, '#fff3a0', '#ff9e4a');
    const nf = (stats.goodEnd ? 1 : 0) + (stats.badEnd ? 1 : 0);
    txt('FINS DECOUVERTES : ' + nf + ' / 2', VW / 2, VH / 2 + 84, nf >= 2 ? '#ffd23d' : '#c8c0e8', 'center');
    txt('UN JEU DE', VW / 2, VH / 2 - 14, '#c8c0e8', 'center'); kaisTxt(VW / 2, VH / 2 + 10, 24, '#ffffff', '#ffd23d');
    b.drawImage(LOGO, Math.round(VW / 2 - 15), VH / 2 + 44, 30, 34);
    if (Math.floor(time * 2) % 2) txt(mobile ? 'TOUCHE POUR CONTINUER' : consoleMode ? 'X POUR CONTINUER' : padMode ? 'A POUR CONTINUER' : 'ENTREE POUR CONTINUER', VW / 2, VH - 30, '#8a84a8', 'center');
    b.globalAlpha = 1;
  }
  // le petit mot en bas à droite
  const psT = tr("PS : JE T'AIME LUDO"); b.font = '8px ' + FONT; const psW = b.measureText(psT).width;
  b.drawImage(HEART, Math.round(VW - 8 - psW - 14), VH - 15);
  txt("PS : JE T'AIME LUDO", VW - 8, VH - 14, '#ff9ae0', 'right');
}

let vigC = null;   // assombrissement des bords, dessiné une seule fois
function draw(){
  b.imageSmoothingEnabled = false;
  if (!shakeOn) shake = 0;
  if (state === 'splash') drawSplash();
  else if (state === 'device') drawDevice();
  else if (state === 'shop') drawShop();
  else if (state === 'ach') drawAch();
  else if (state === 'modes') drawModes();
  else if (state === 'runEnd') drawRunEnd();
  else if (state === 'journal') drawJournal();
  else if (state === 'cinema') drawCinema();
  else if (state === 'epilogue') drawEpilogue();
  else if (state === 'secretEnd') drawSecretEnd();
  else if (state === 'minaCine') drawMinaCine();
  else if (state === 'story') drawStory();
  else if (state === 'ending') drawEnding();
  else if (state === 'credits') drawCredits();
  else if (state === 'unlock') drawUnlock();
  else if (state === 'intro') drawIntro();
  else if (state === 'title' || state === 'win') drawTitle();
  else if (state === 'pause' && prevState === 'title'){ drawTitle(); drawPause(); }
  else {
    const shx = shake > 0 ? Math.round(rnd(-shake, shake)) : 0, shy = shake > 0 ? Math.round(rnd(-shake, shake)) : 0;
    const cx = Math.round(cam.x) + shx, cy = ROWS * T - VH + shy;
    drawBackground(lvl.th, cx);
    drawTiles(cx, cy);
    drawDecor(cx, cy);
    drawWinds(cx, cy);
    drawEntities(cx, cy);
    drawLumi(cx, cy);
    drawPlayer(cx, cy);
    drawShots(cx, cy);
    drawParticles(cx, cy);
    drawAmb(lvl.th.amb);
    if (['firefly', 'ember', 'void', 'rain'].includes(lvl.th.amb)){ if (!vigC || vigC.width !== VW){ vigC = document.createElement('canvas'); vigC.width = VW; vigC.height = VH; const vc = vigC.getContext('2d'), g = vc.createRadialGradient(VW / 2, VH / 2, VH * .3, VW / 2, VH / 2, VW * .7); g.addColorStop(0, 'rgba(10,6,30,0)'); g.addColorStop(1, 'rgba(10,6,30,.55)'); vc.fillStyle = g; vc.fillRect(0, 0, VW, VH); } b.drawImage(vigC, 0, 0); }
    if (state !== 'photo') drawHUD();
    else if (photoT < 1.6){ b.globalAlpha = Math.min(1, (1.6 - photoT) * 2); txt(mobile ? 'MODE PHOTO : TOUCHE POUR REVENIR' : 'MODE PHOTO : UNE TOUCHE POUR REVENIR', VW / 2, VH - 14, '#ffffff', 'center'); b.globalAlpha = 1; }
    if (state === 'clear' && clearT > .9){
      const pnl = panel(240, 148, DIFF[lvl.diff][1]), n = lvl.stars.filter(s => s.taken).length, t = Math.floor(levelTime);
      txt('NIVEAU TERMINÉ !', VW / 2, pnl.y + 14, '#ffd23d', 'center');
      for (let i = 0; i < 3; i++){
        const show = clearT > 1.2 + i * .25;
        if (i < n && show) b.drawImage(STAR_BIG, VW / 2 - 30 + i * 22, pnl.y + 32); else b.drawImage(STAR_OFF, VW / 2 - 26 + i * 22, pnl.y + 35);
      }
      b.drawImage(GEM, pnl.x + 38, pnl.y + 60); txt('ÉCLATS', pnl.x + 52, pnl.y + 62, '#ffffff'); txt(coins + '/' + lvl.coins.length, pnl.x + 200, pnl.y + 62, '#6ad8ff', 'right');
      txt('TEMPS', pnl.x + 52, pnl.y + 77, '#ffffff'); txt(Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'), pnl.x + 196, pnl.y + 77, '#ffd23d', 'right');
      if (clearT > 1.9) drawMedal(pnl.x + 212, pnl.y + 81, lvl.medal || 0, 5);
      txt('MORTS', pnl.x + 52, pnl.y + 92, '#ffffff'); txt(String(deaths), pnl.x + 200, pnl.y + 92, '#ff9ab0', 'right');
      txt('+' + (lvl.earned || 0) + ' ECLATS' + (lvl.bonus ? ' (MEDAILLE ' + MEDAL_NAME[lvl.medal] + ' +' + lvl.bonus + ')' : ''), VW / 2, pnl.y + 110, '#6ad8ff', 'center');
      if (clearT > 1.6 && Math.floor(time * 2) % 2) txt(lvl.i < NMAIN - 1 && !lvl.secret && !runMode ? 'ENTRÉE : NIVEAU SUIVANT' : 'ENTRÉE : CONTINUER', VW / 2, pnl.y + 128, '#8ad8ff', 'center');
    }
    if (state === 'pause') drawPause();
    if (state === 'memory') drawMemory();
    if (state === 'lumiMeet') drawLumiMeet();
  }
  if (trans){
    const k = trans.t < trans.d ? trans.t / trans.d : 2 - trans.t / trans.d;
    const R = (1 - k) * Math.hypot(VW, VH) * .6;
    let px = VW / 2, py = VH / 2;
    if (P && lvl && state !== 'title' && state !== 'win'){ px = P.x - cam.x + 5; py = P.y - (ROWS * T - VH) + 6; }
    b.fillStyle = '#0b0824'; b.beginPath(); b.rect(0, 0, VW, VH); if (R > 1) b.arc(px, py, R, 0, TAU, true); b.fill();
  }
  if (state !== 'minaCine' && state !== 'photo') drawToasts(1 / 60);
  if (mobile && innerHeight > innerWidth){
    b.fillStyle = 'rgba(5,3,12,.8)'; b.fillRect(0, VH / 2 - 26, VW, 52);
    txt('TOURNE TON TELEPHONE', VW / 2, VH / 2 - 14, '#ffd23d', 'center'); txt('EN MODE PAYSAGE', VW / 2, VH / 2 + 2, '#ffffff', 'center');
  }
  if (retroOn && state !== 'minaCine') retroFilter();
  sx.imageSmoothingEnabled = false;
  sx.fillStyle = '#000'; sx.fillRect(0, 0, scr.width, scr.height);
  sx.drawImage(buf, 0, 0, VW, VH, Math.round(offX), Math.round(offY), Math.round(VW * scale), Math.round(VH * scale));
}

/* =========================================================
   BOUCLE
   ========================================================= */
initAmb();
document.body.classList.toggle('mobile', false);
// PS5 : la touche ROND fait « page précédente » -> on l'intercepte pour ouvrir la pause au lieu de quitter le jeu
if (IS_PS){
  try {
    history.pushState({ pip: 1 }, '');
    addEventListener('popstate', () => {
      try { history.pushState({ pip: 1 }, ''); } catch (e) {}
      if (state === 'shop') shopKey('escape');
      else if (state === 'ach') closeAch();
      else if (state === 'journal') closeJournal();
      else if (state === 'play' || state === 'title') togglePause();
      else if (state === 'pause') pauseKey('escape');
    });
  } catch (e) {}
}
let last = performance.now();
function loop(now){
  const dt = Math.max(0, Math.min(1 / 30, (now - last) / 1000)); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"');
})();
</script>
